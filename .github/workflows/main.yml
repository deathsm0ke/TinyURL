name: Build and Deploy TinyURL Suite

on:
  push:
    branches: [ "master", "main" ] # Triggers on push to either branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      # --- STEP 1: SETUP ENVIRONMENTS ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # High version for Angular 19+

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # --- STEP 2: BUILD ANGULAR UI ---
      - name: Build Angular
        run: |
          cd tiny-url-ui
          npm install
          npx ng build --configuration production --output-path=dist/browser --base-href=/
          
          echo "Verifying Angular build output:"
          ls -R dist/browser

      # --- STEP 3: PUBLISH .NET 10 API ---
      - name: Publish API
        run: |
          # 1. Build Angular (Stay inside the UI folder)
          cd WebApplication1/tiny-url-ui
          npm install
          npx ng build --configuration production --output-path=dist/browser
          
          # 2. Go back to Root and Publish .NET
          cd ../../
          dotnet publish WebApplication1/WebApplication1.csproj -c Release -o ./publish_api
          
          # 3. Create wwwroot and Move files using the LOCAL path relative to the UI folder
          mkdir -p ./publish_api/wwwroot
          
          # This path is now 100% guaranteed because we just built it 2 lines ago
          cp -r WebApplication1/tiny-url-ui/dist/browser/browser/* ./publish_api/wwwroot/
          
          # 4. FINAL VERIFICATION (Check the logs for this!)
          echo "Listing final publish package wwwroot content:"
          ls -F ./publish_api/wwwroot
          

      # --- STEP 4: PUBLISH .NET 10 FUNCTION (Isolated) ---
      - name: Publish Function
        run: dotnet publish TinyUrlCleaner/TinyUrlCleaner.csproj -c Release -o ./publish_function

      # --- STEP 5: DEPLOY API + UI TO WEB APP ---
      - name: Deploy Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tinyurl-api-a' 
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish_api

      # --- STEP 6: DEPLOY CLEANER TO FUNCTION APP ---
      - name: Deploy Function App
        uses: azure/functions-action@v1
        with:
          app-name: 'tiny-url-cleaner-a'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          package: ./publish_function