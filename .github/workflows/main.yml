name: Build and Deploy TinyURL Suite

on:
  push:
    branches: [ "master", "main" ] # Triggers on push to either branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      # --- STEP 1: SETUP ENVIRONMENTS ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # High version for Angular 19+

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # --- STEP 2: BUILD ANGULAR UI ---
      - name: Build Angular
        run: |
          cd tiny-url-ui
          npm install
          npx ng build --configuration production

      # --- STEP 3: PUBLISH .NET 10 API ---
      - name: Publish API
        run: |
          # 1. Publish the .NET binaries
          dotnet publish WebApplication1/WebApplication1.csproj -c Release -o ./publish_api
          
          # 2. Ensure wwwroot exists in the publish folder
          mkdir -p ./publish_api/wwwroot
          
          # 3. Find where the Angular files actually landed and copy them
          # This searches for 'index.html' and copies its parent folder contents
          ANGULAR_DIST_DIR=$(find WebApplication1/tiny-url-ui/dist -name index.html -exec dirname {} \;)
          echo "Angular files found in: $ANGULAR_DIST_DIR"
          
          cp -r $ANGULAR_DIST_DIR/* ./publish_api/wwwroot/
          
          # 4. FINAL CHECK: Confirm index.html is in the right place
          echo "Checking publish_api/wwwroot for deployment:"
          ls -F ./publish_api/wwwroot

      # --- STEP 4: PUBLISH .NET 10 FUNCTION (Isolated) ---
      - name: Publish Function
        run: dotnet publish TinyUrlCleaner/TinyUrlCleaner.csproj -c Release -o ./publish_function

      # --- STEP 5: DEPLOY API + UI TO WEB APP ---
      - name: Deploy Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tinyurl-api-a' 
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish_api

      # --- STEP 6: DEPLOY CLEANER TO FUNCTION APP ---
      - name: Deploy Function App
        uses: azure/functions-action@v1
        with:
          app-name: 'tiny-url-cleaner-a'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          package: ./publish_function