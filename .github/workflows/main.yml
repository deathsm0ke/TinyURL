name: Build and Deploy TinyURL Suite

on:
  push:
    branches: [ "master", "main" ] # Triggers on push to either branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      # --- STEP 1: SETUP ENVIRONMENTS ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # High version for Angular 19+

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # --- STEP 2: BUILD ANGULAR UI ---
      - name: Build Angular
        run: |
          cd tiny-url-ui
          npm install
          npx ng build --configuration production --output-path=dist/browser --base-href=/
          
          echo "Verifying Angular build output:"
          ls -R dist/browser

      # --- STEP 3: PUBLISH .NET 10 API ---
      - name: Publish API
        run: |
          # 1. Publish the .NET binaries
          dotnet publish WebApplication1/WebApplication1.csproj -c Release -o ./publish_api
          
          # 2. Create the wwwroot folder
          mkdir -p ./publish_api/wwwroot
          
          # 3. DYNAMIC SEARCH AND COPY
          # This command looks for the folder containing index.html inside the UI directory
          # and copies everything from THAT folder into our publish wwwroot.
          UI_DIST_DIR=$(find WebApplication1/tiny-url-ui/dist -name "index.html" -printf '%h\n' | head -n 1)
          
          echo "Discovered Angular files at: $UI_DIST_DIR"
          
          if [ -z "$UI_DIST_DIR" ]; then
            echo "ERROR: index.html not found in any dist subfolder!"
            exit 1
          fi
          
          cp -r "$UI_DIST_DIR"/* ./publish_api/wwwroot/
          
          # 4. DIAGNOSTIC: This MUST show index.html, main.js, etc.
          echo "Listing final publish package wwwroot:"
          ls -F ./publish_api/wwwroot

      # --- STEP 4: PUBLISH .NET 10 FUNCTION (Isolated) ---
      - name: Publish Function
        run: dotnet publish TinyUrlCleaner/TinyUrlCleaner.csproj -c Release -o ./publish_function

      # --- STEP 5: DEPLOY API + UI TO WEB APP ---
      - name: Deploy Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tinyurl-api-a' 
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish_api

      # --- STEP 6: DEPLOY CLEANER TO FUNCTION APP ---
      - name: Deploy Function App
        uses: azure/functions-action@v1
        with:
          app-name: 'tiny-url-cleaner-a'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          package: ./publish_function